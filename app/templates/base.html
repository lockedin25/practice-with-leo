<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Leo · AI Case Interviewer{% endblock %}</title>
    <meta name="description" content="{% block description %}Practise MBB consulting case interviews with Leo, an AI interviewer that releases evidence only when your reasoning earns it.{% endblock %}" />
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500;1,6..72,600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/tokens.css" />
    {% block stylesheets %}{% endblock %}
  </head>
  <body class="{% block body_class %}{% endblock %}">
    {% if not hide_global_header|default(false) %}{% include "_site_header.html" %}{% endif %}

{% block content %}{% endblock %}

    <script src="/static/theme.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
