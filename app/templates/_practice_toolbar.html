{# Page-level live-session controls. Global navigation remains in
   _site_header.html so the practice route has the same app shell as every
   other signed-in page. #}
<section class="topbar" aria-label="Live interview controls">
  <div class="topbar-inner">
    <p class="session-label">
      <span class="pulse-dot" aria-hidden="true"></span>
      <span id="session-status-text">Leo is listening</span>
      <span class="session-mode" id="session-mode">Realistic</span>
    </p>

    <div class="topbar-actions">
      <div class="voice-controls hidden" id="voice-controls">
        <span class="voice-status" id="voice-status" aria-live="polite">Chat</span>
        <button class="button button-ghost" id="voice-toggle" type="button">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="voice-mic-icon">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
          <span id="voice-toggle-label">Start voice</span>
        </button>
      </div>

      <button class="button button-ghost" id="end-attempt" type="button">End practice</button>
    </div>
  </div>
</section>
