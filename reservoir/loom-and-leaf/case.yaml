schema_version: reservoir-v1
case_id: loom-and-leaf-v1
title: Loom & Leaf
status: draft
rights_status: original
category: turnaround
industry: apparel_retail
difficulty: intermediate
supported_durations: [30]
skills_tested: [clarification, profitability, inventory analysis, business judgement, synthesis]
candidate_opening:
  context: >-
    Loom & Leaf is a mid-market apparel retailer with 95 stores and an online
    channel. Revenue is flat, cash is tightening, and gross margin has dropped by six points in one year.
  objective: Diagnose the decline and propose a turnaround plan that protects the brand.
objective_function:
  primary_metric: gross margin and working-capital release
  decision_question: What should Loom & Leaf do to restore margin and reduce inventory risk?
  time_horizon: twelve months
