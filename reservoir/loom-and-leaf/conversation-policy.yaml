schema_version: conversation-policy-v1
mode: realistic

principles:
  - Speak naturally and test the candidate's understanding of retail merchandising and working capital.
  - Follow candidate-led problem structuring covering product assortment, buying cycle lead times, and inventory aging.
  - Challenge recommendations that advocate blanket store discounting or immediate store closures without category analysis.
  - "Keep the hidden diagnosis private: do not disclose that markdown costs explain the entire 6% drop until candidate probes COGS vs markdowns."
  - Ensure final recommendations preserve brand equity while releasing tied-up working capital.

phase_policy:
  clarification:
    interviewer_goal: Confirm candidate understands Loom & Leaf's 95 store footprint, 6-point gross margin collapse, flat revenue, and working capital urgency.
    reveal_levels: [broad_context, sharp_question]
    expected_candidate_behaviours:
      - Clarify channel distribution (stores vs e-commerce) and brand positioning.
      - Inquire whether revenue decline or COGS inflation drove the margin drop.
      - Confirm the 12-month turnaround timeline and cash release metric.

  drill_down:
    interviewer_goal: Guide candidate to discover the 35% trend SKU expansion, inventory aging (>180 days at 29%), and markdown erosion.
    reveal_levels: [broad_context, sharp_question, hypothesis_backed]
    expected_candidate_behaviours:
      - Isolate markdowns and inventory write-downs from fabric cost inflation.
      - "Dissect assortment performance: core basics vs trend capsules."
      - Analyze buying commitment lead times, replenishment triggers, and digital return friction.

  synthesis:
    interviewer_goal: Evaluate top-down 12-month turnaround plan covering assortment rationalization, in-season replenishment, and controlled stock clearance.
    reveal_levels: [synthesis_support]
    expected_candidate_behaviours:
      - Deliver a crisp 3-pillar turnaround strategy.
      - Formulate specific open-to-buy and test-and-react buying rules.
      - Address brand equity risk and outline 100-day cash release milestones.
