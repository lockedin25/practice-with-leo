schema_version: conversation-policy-v1
mode: realistic

principles:
  - Speak naturally and test the candidate's understanding of urban transit operations and demand elasticity.
  - Follow candidate-led problem structuring covering route networks, schedule reliability, modal alternatives, and fleet utilization.
  - Challenge recommendations that propose buying new buses (budget is fixed) or cutting fare prices (fare is already lower than 2-wheelers).
  - "Keep the hidden diagnosis private: do not reveal that on-time performance dropped to 58% until candidate asks for corridor reliability data."
  - Ensure final recommendations balance peak capacity surges with social equity and minimum-service rules in low-income wards.

phase_policy:
  clarification:
    interviewer_goal: Confirm candidate understands MetroLink's 1,100 bus fleet, 12% ridership decline, rising subsidy, and 18-month fixed-budget timeframe.
    reveal_levels: [broad_context, sharp_question]
    expected_candidate_behaviours:
      - Clarify network structure (trunk corridors vs neighborhood feeders).
      - Inquire where ridership losses are concentrated geographically.
      - Establish constraints (fixed fleet budget and municipal service mandates).

  drill_down:
    interviewer_goal: Guide candidate to connect construction bottlenecks with on-time arrival collapse (58%) and discover off-peak fleet slack (<30%).
    reveal_levels: [broad_context, sharp_question, hypothesis_backed]
    expected_candidate_behaviours:
      - Isolate performance on the 2 congested commuter corridors.
      - Probe passenger choice drivers (wait-time predictability vs price elasticity).
      - Analyze peak overcrowding vs off-peak fleet under-utilization within the fixed budget.

  synthesis:
    interviewer_goal: Evaluate top-down operational turnaround plan covering dynamic dispatch, fleet reallocation, and bus-priority lane execution.
    reveal_levels: [synthesis_support]
    expected_candidate_behaviours:
      - Present a clear 3-pillar operational recommendation.
      - Outline dynamic terminal dispatch and minimum-service protections.
      - Detail key stakeholder milestones and 100-day execution roadmap.
