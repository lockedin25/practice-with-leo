schema_version: reservoir-facts-v1
facts:
  - id: company.model
    domain: company
    release_level: broad_context
    content: "Forge supplies precision machined components to industrial-equipment makers and buys specialised castings from external suppliers."
    candidate_purpose: "Establish Forge's position in precision industrial component supply chain."
    question_examples:
      - "What products does Forge manufacture and who are its primary customers?"
      - "What is Forge's existing supply chain for castings?"

  - id: target.profile
    domain: company
    release_level: sharp_question
    content: "AlloyWorks is a smaller casting supplier with spare capacity, strong process know-how, and a customer base overlapping Forge by about 20 percent."
    candidate_purpose: "Describe target profile, technical capability, and customer overlap."
    question_examples:
      - "What is AlloyWorks' business model and capacity status?"
      - "How much customer overlap exists between Forge and AlloyWorks?"

  - id: standalone
    domain: financials
    release_level: sharp_question
    content: "AlloyWorks is profitable but has grown slowly because it lacks Forge's sales reach and is exposed to volatile raw-material purchasing."
    candidate_purpose: "Disclose standalone financial health and commercial constraints."
    question_examples:
      - "What are AlloyWorks' standalone financial performance and historical growth rates?"
      - "What factors have limited AlloyWorks' standalone expansion?"

  - id: cost_synergy
    domain: economics
    release_level: hypothesis_backed
    content: "Combining procurement could lower metal-input cost by 4 percent, and internal sourcing could remove supplier margin on a defined set of parts."
    dependencies: [standalone]
    candidate_purpose: "Quantify hard cost synergies from procurement and in-sourcing margin capture."
    question_examples:
      - "What cost synergies can be achieved by combining procurement and in-sourcing?"
      - "How much can metal purchasing costs be reduced under Forge's volume?"

  - id: revenue_synergy
    domain: economics
    release_level: hypothesis_backed
    content: "Forge's sales team could cross-sell AlloyWorks capabilities to selected customers, but revenue synergy requires engineering qualification cycles that often take 12 to 18 months."
    dependencies: [target.profile]
    candidate_purpose: "Expose revenue synergy lead times and customer qualification friction."
    question_examples:
      - "Can Forge cross-sell AlloyWorks castings to its industrial client base?"
      - "How long does OEM engineering qualification take for cross-sold parts?"

  - id: capacity
    domain: operations
    release_level: sharp_question
    content: "AlloyWorks has spare capacity today, but the plant needs targeted automation investment to meet Forge's quality and delivery standards at scale."
    candidate_purpose: "Reveal required post-acquisition plant automation capex."
    question_examples:
      - "Is AlloyWorks' manufacturing facility ready to scale immediately?"
      - "What capex is required to bring AlloyWorks up to Forge's operational standards?"

  - id: valuation
    domain: financials
    release_level: hypothesis_backed
    content: "The seller's price assumes much of the procurement synergy, leaving limited value creation if Forge pays the full asking multiple."
    dependencies: [cost_synergy]
    candidate_purpose: "Highlight valuation risk: seller pricing captures cost synergies upfront."
    question_examples:
      - "What valuation multiple is the seller asking?"
      - "Does the seller's asking price already incorporate expected synergies?"

  - id: integration
    domain: risk
    release_level: sharp_question
    content: "AlloyWorks' founder is central to customer relationships and process decisions; immediate full integration could create retention and execution risk."
    candidate_purpose: "Identify key-man dependency and integration friction."
    question_examples:
      - "What are the key organizational and integration risks?"
      - "How critical is the founder to AlloyWorks' ongoing operations?"

  - id: alternatives
    domain: strategy
    release_level: broad_context
    content: "Forge can pursue a long-term supply agreement and minority investment, but that would capture less procurement benefit and limit operational control."
    candidate_purpose: "Provide strategic alternatives: long-term contract vs full acquisition."
    question_examples:
      - "What alternatives to full acquisition has Forge considered?"
      - "Could Forge achieve its goals through a joint venture or supply agreement?"

  - id: diagnosis.hidden
    domain: diagnosis
    release_level: interviewer_only
    provenance: source_derived
    content: "The acquisition destroys value at the seller's asking price because it prices in all procurement synergies while ignoring 12-18 month customer re-qualification delays, required automation capex, and founder key-man risk; Forge must bid strictly on standalone value plus discounted cost synergies, structuring founder earnouts and capex milestones."
    candidate_purpose: "Never disclose directly. Benchmark for evaluator answer-key comparison and interviewer recovery."

  - id: recommendation.price
    domain: recommendation
    release_level: synthesis_support
    content: "Proceed only at a price that leaves Forge value after realistic, risk-adjusted procurement and phased revenue synergies."
    candidate_purpose: "Pillar 1: Disciplined acquisition pricing and earnout structure."

  - id: recommendation.integration
    domain: recommendation
    release_level: synthesis_support
    content: "Use a staged integration plan that protects AlloyWorks' technical leadership while installing quality and procurement controls."
    candidate_purpose: "Pillar 2: Staged operational integration and founder retention."

  - id: recommendation.diligence
    domain: recommendation
    release_level: synthesis_support
    content: "Confirm customer retention, automation capex, qualification timing, and the founder's post-deal role before signing."
    candidate_purpose: "Pillar 3: Confirmatory due diligence and closing conditions."
