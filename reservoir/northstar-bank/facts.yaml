schema_version: reservoir-facts-v1
facts:
  - {id: company.position, domain: company, release_level: broad_context, content: "Northstar has 8 million retail customers, a trusted urban brand, and strong digital payments adoption among salaried customers."}
  - {id: objective.scope, domain: objective, release_level: sharp_question, content: "The board wants profitable retail income growth, not loan-book growth at any cost."}
  - {id: segments.current, domain: customers, release_level: sharp_question, content: "Affluent urban customers generate 55 percent of retail income but are mature; emerging affluent customers in tier-two cities are growing faster but are under-served."}
  - {id: market.opportunity, domain: market, release_level: hypothesis_backed, content: "In Northstar's target tier-two cities, about 12 million digitally active households have formal savings accounts but limited access to advice, unsecured credit, and investment products."}
  - {id: economics.segment, domain: economics, release_level: hypothesis_backed, content: "An emerging-affluent household can generate positive lifetime value if it holds a salary account, uses payments, and takes one credit or investment product within two years."}
  - {id: channel.cost, domain: operations, release_level: sharp_question, content: "A full branch costs roughly four times as much to acquire and serve a customer as a relationship-manager hub supported by digital onboarding."}
  - {id: competition, domain: market, release_level: sharp_question, content: "Large private banks lead on branch density, while fintechs lead on simple onboarding but generally do not offer a full advisory relationship."}
  - {id: capability, domain: company, release_level: broad_context, content: "Northstar already has a digital onboarding stack and a partner network of payroll providers, but its tier-two credit models use sparse local data."}
  - {id: risk.credit, domain: risk, release_level: hypothesis_backed, content: "Unsecured credit losses rise sharply when acquisition incentives outpace underwriting quality; the bank cannot use broad pre-approved offers without local risk calibration."}
  - {id: recommendation.hub, domain: recommendation, release_level: synthesis_support, content: "Pilot a hub-and-digital model in a limited set of cities, pairing digital acquisition with advisers for high-value life events and product cross-sell."}
  - {id: recommendation.sequence, domain: recommendation, release_level: synthesis_support, content: "Start with salary-account and payments acquisition, then offer credit or investments only after observed cash-flow and engagement signals improve risk confidence."}
  - {id: recommendation.measure, domain: recommendation, release_level: synthesis_support, content: "Track activated accounts, product depth, acquisition cost, delinquency, and cohort contribution rather than headline account openings."}
