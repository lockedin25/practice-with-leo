candidate_opening:
  context: >-
    Your client is Meridian Cold Chain, an Indian temperature-controlled
    logistics operator. It moves packaged food and pharmaceutical products for
    manufacturers across the country. Revenue has grown steadily for two years,
    but EBITDA margin has fallen from about 18 percent to about 11 percent.
  objective: >-
    Determine why the margin has declined and recommend what the CEO should do
    over the next twelve months.
  opening_requirements:
    - Name the client and its business.
    - State the performance problem.
    - State the decision and time horizon.
    - Invite clarifying questions before requesting a structure.

objective_function:
  primary_metric: EBITDA margin
  decision_question: Why has EBITDA margin fallen, and what should the CEO do?
  time_horizon: twelve months
  expected_candidate_output:
    - Clear diagnosis supported by evidence.
    - Prioritised recommendation.
    - Main implementation risk.
    - Concrete next step.
  design_principle: >-
    Reward a well-structured, hypothesis-driven path over memorising a single
    final answer.

case_essence:
  core_mechanism: >-
    Adverse product/customer mix shift into pharmaceutical cold chain (from 5% to 30% volume)
    which has lower vehicle load factor (55% vs 88% for packaged food) due to strict 2–8°C
    non-consolidation rules, yet contracts were priced using the legacy food cost base plus
    a generic markup, producing ₹0 contribution margin per kg.
  what_the_case_wanted_to_test: >-
    Capacity utilization economics in specialized asset logistics, cost-to-serve allocation
    accuracy across regulatory regimes, and the distinction between gross volume growth and margin contribution.
  pivotal_insight: >-
    Revenue and overall volume are healthy, but pharma routes consume capacity without generating
    unit contribution because quotes failed to reflect pharma-specific low route density.
  common_traps:
    - Assuming food and pharma shipments can be co-loaded in the same reefer vehicle to raise load factors, violating pharma regulatory compliance.
    - Blaming fuel inflation or driver wage hikes across all regions without testing segment-level cost-to-serve.
    - Proposing an immediate exit from pharmaceutical logistics rather than renegotiating minimum fill rates and dedicated route pricing.
  takeaway_lesson: >-
    In asset-intensive network logistics, pricing must be tied directly to route density and dedicated
    utilization constraints, never to average system-wide unit costs.
  suggested_readings:
    - knowledge_base/industries/01_logistics_and_cold_chain.md
    - knowledge_base/case_types/profitability.md
    - knowledge_base/methodology/02_issue_tree_structuring.md

