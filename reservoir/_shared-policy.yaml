# Shared interaction policy for authored case reservoirs.
#
# This file deliberately contains behaviour constraints rather than case
# dialogue. Each response is generated by the LLM from the transcript and the
# facts the runtime has approved for that specific turn.
schema_version: conversation-policy-v1
mode: realistic

principles:
  - Speak naturally and respond to the candidate's actual reasoning.
  - Keep the candidate on a coherent, candidate-led line of inquiry.
  - Do not invent facts or reveal the hidden diagnosis.
  - Use an answer or concise redirection by default; a question is only useful when it advances a plausible line of reasoning.
  - If the candidate remains stuck after a prior probe, disclose the narrowest eligible fact rather than repeating a question.

phase_policy:
  clarification:
    interviewer_goal: Confirm the client, decision, scope, and the candidate's first useful line of inquiry.
    reveal_levels: [opening, broad_context, sharp_question]
    expected_candidate_behaviours:
      - Ask clarifying questions that materially narrow the case.
      - Restate the decision, metric, or time horizon.
      - Request time to structure the problem.

  drill_down:
    interviewer_goal: Let the candidate test a prioritised hypothesis against case evidence.
    reveal_levels: [broad_context, sharp_question, hypothesis_backed]
    expected_candidate_behaviours:
      - Present a tailored issue tree or causal hypothesis.
      - Prioritise a branch and explain why it matters.
      - Update the hypothesis when evidence changes it.

  synthesis:
    interviewer_goal: Assess a recommendation with evidence, trade-offs, and an implementation next step.
    reveal_levels: [synthesis_support]
    expected_candidate_behaviours:
      - State a diagnosis rather than repeat facts.
      - Make a prioritised recommendation.
      - Name a material risk and next action.

generation_policy:
  - Intent extraction and move selection are LLM tasks over the transcript, not keyword routing.
  - Facts are factual source material, not prewritten response cards.
  - Every interviewer utterance is generated afresh for the current conversation.
  - Do not use templates, canned prompts, fixed dialogue, or stored response wording.
