candidate_opening:
  context: Your client is a premier Grade-A commercial office REIT in Bengaluru with 12M sq ft across 4 tech parks. Portfolio
    occupancy dropped from 94% to 76% following IT client lease non-renewals.
  objective: Diagnose the structural occupancy decline and propose a commercial asset turnaround plan.
  opening_requirements:
  - Name Commercial Office REIT and its core operating model.
  - Confirm the core performance challenge or strategic mandate.
  - Confirm primary metric (Portfolio Occupancy and Net Operating Income (NOI)) and time horizon (eighteen months).
  - Ask clarifying questions before structuring the issue tree.
objective_function:
  primary_metric: Portfolio Occupancy and Net Operating Income (NOI)
  decision_question: Why did Grade-A IT office occupancy collapse and how should lease structures be adapted for hybrid work?
  time_horizon: eighteen months
  expected_candidate_output:
  - Root cause diagnosis supported by unit economics and data.
  - Prioritized 3-pillar actionable recommendation.
  - Key operational and commercial risks with mitigations.
  - 100-day execution milestones.
  design_principle: Reward first-principles problem structuring and hypothesis testing over memorized framework dumping.
case_essence:
  core_mechanism: Rigid 9-year long-term lease terms with 3-year lock-ins rejected by global IT clients who adopted hybrid
    3-day workweeks and downsized dedicated desk footprints by 35%.
  what_the_case_wanted_to_test: Commercial real estate yield, hybrid workplace dynamics, flexible enterprise managed spaces
    vs traditional bare-shell leases, and amenity monetization.
  pivotal_insight: Tenants do not want to exit tech parks; they want to reduce dedicated leased floor plates while paying
    a premium for flexible, on-demand managed desks and meeting suites.
  common_traps:
  - Slashing baseline base rent by 50% across all leases, destroying REIT debt service coverage.
  - Assuming tech companies will fully return to 5-day in-office work mandating zero lease changes.
  - Converting commercial office parks into residential apartments.
  takeaway_lesson: In commercial real estate facing hybrid work disruption, landlord value shifts from leasing raw square
    footage on multi-year terms to operating flexible, fully managed workplace hospitality.
  suggested_readings:
  - knowledge_base/industries/12_hospitality_and_tourism.md
  - knowledge_base/case_types/growth_strategy.md
  - knowledge_base/methodology/01_preliminary_questions.md
