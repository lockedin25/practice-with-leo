schema_version: reservoir-facts-v1
facts:
- id: capex.scale
  domain: company
  release_level: broad_context
  content: Operator deployed 150,000 5G base stations covering 80% of urban India.
- id: arpu.trend
  domain: financials
  release_level: sharp_question
  content: "ARPU is \u20B9182; 5G data consumption is 32 GB/month (vs 11 GB on 4G), but 5G users pay the same \u20B9299 monthly\
    \ recharge."
- id: consumer.perception
  domain: customers
  release_level: hypothesis_backed
  content: Consumers see no willingness to pay extra for mobile 5G speed on social media/video, but 45% of households lack
    high-speed fiber home broadband.
