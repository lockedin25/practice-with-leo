candidate_opening:
  context: Your client is a heritage bridal and ethnic wear retailer with 18 luxury stores in North India. Gross margins fell
    by 800 bps due to heavy end-of-season clearance markdowns.
  objective: Diagnose inventory markdown losses and propose an open-to-buy merchandising and bridal customization model.
  opening_requirements:
  - Name Bridal Ethnic Wear Retailer and its core operating model.
  - Confirm the core performance challenge or strategic mandate.
  - Confirm primary metric (Gross Margin and Full-Price Sell-Through (%)) and time horizon (twelve months).
  - Ask clarifying questions before structuring the issue tree.
objective_function:
  primary_metric: Gross Margin and Full-Price Sell-Through (%)
  decision_question: Why did ethnic wear gross margins collapse and how should bridal inventory buying be redesigned?
  time_horizon: twelve months
  expected_candidate_output:
  - Root cause diagnosis supported by unit economics and data.
  - Prioritized 3-pillar actionable recommendation.
  - Key operational and commercial risks with mitigations.
  - 100-day execution milestones.
  design_principle: Reward first-principles problem structuring and hypothesis testing over memorized framework dumping.
case_essence:
  core_mechanism: "Decentralized subjective bridal buying resulting in heavy pre-ordering of high-ticket bespoke bridal lehengas\
    \ (\u20B91.5L-3L) that are size- and color-specific, leaving 40% unsold and requiring 60% markdowns."
  what_the_case_wanted_to_test: Fashion retail merchandising, made-to-order vs ready-to-wear inventory risk, open-to-buy governance,
    and bridal customization lead times.
  pivotal_insight: High-ticket bridal lehengas require made-to-measure customization; stocking pre-stitched finished inventory
    created massive obsolescence, while semi-stitched sample swatches eliminate inventory risk.
  common_traps:
  - Assuming fabric embroidery craftsmanship costs increased.
  - Proposing closing half the physical luxury stores without analyzing category sell-through.
  - Blaming e-commerce competition for bespoke bridal wear.
  takeaway_lesson: In high-ticket bespoke luxury apparel, stocking finished inventory creates extreme markdown risk; retail
    stores should operate as sample showrooms with made-to-order manufacturing.
  suggested_readings:
  - knowledge_base/industries/09_retail_and_fashion.md
  - knowledge_base/case_types/profitability.md
  - knowledge_base/methodology/03_hypothesis_driven_drilling.md
