schema_version: reservoir-v1
case_id: 11-zoomcar-mobility-v1
title: Self-Drive Car Rental Platform
school: IIM-A
status: approved
rights_status: original
category: profitability
industry: logistics_and_cold_chain
difficulty: intermediate
supported_durations:
- 30
skills_tested:
- clarification
- tailored structure
- unit economics
- hypothesis drilling
