candidate_opening:
  context: Your client operates an executive private jet charter fleet of 12 mid-sized business aircraft in India. Aircraft
    EBITDA is negative despite high corporate charter hourly rates.
  objective: Diagnose the low fleet profitability and recommend a schedule and fleet utilization plan.
  opening_requirements:
  - Name Private Jet Charter Fleet and its core operating model.
  - Confirm the core performance challenge or strategic mandate.
  - Confirm primary metric (Revenue hours per aircraft per month and Empty-Leg Ratio (%)) and time horizon (twelve months).
  - Ask clarifying questions before structuring the issue tree.
objective_function:
  primary_metric: Revenue hours per aircraft per month and Empty-Leg Ratio (%)
  decision_question: "Why is the private jet charter operator losing money despite charging \u20B94.5 lakh per flight hour?"
  time_horizon: twelve months
  expected_candidate_output:
  - Root cause diagnosis supported by unit economics and data.
  - Prioritized 3-pillar actionable recommendation.
  - Key operational and commercial risks with mitigations.
  - 100-day execution milestones.
  design_principle: Reward first-principles problem structuring and hypothesis testing over memorized framework dumping.
case_essence:
  core_mechanism: Severe deadhead empty-leg ferry flights (38% of total flight hours) where aircraft reposition without paying
    passengers, combined with high fixed parking and hangar fees at congested metro airports.
  what_the_case_wanted_to_test: Aviation fleet economics, empty-leg ferry flight monetization, dynamic base repositioning,
    and maintenance downtime scheduling.
  pivotal_insight: 38% of all flight hours are unpaid deadhead repositioning flights (e.g. flying empty from Delhi to Hyderabad
    to pick up a client), consuming fuel and engine maintenance hours without revenue.
  common_traps:
  - Assuming corporate charter demand dried up.
  - Blaming pilot and flight attendant salary inflation.
  - Proposing buying larger long-range intercontinental jets.
  takeaway_lesson: In on-demand aviation and vehicle chartering, unmonetized repositioning deadhead legs destroy margins;
    operators must dynamically market discounted empty-legs or enforce floating fleet dispatch.
  suggested_readings:
  - knowledge_base/industries/06_aviation_and_airlines.md
  - knowledge_base/case_types/profitability.md
  - knowledge_base/methodology/02_issue_tree_structuring.md
