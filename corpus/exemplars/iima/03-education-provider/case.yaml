candidate_opening:
  context: Your client is a premier national IIT-JEE coaching institute with 40 centers. Operating profit dropped 28% year-on-year
    despite record student enrollments.
  objective: Diagnose the root cause of the profit decline and propose a sustainable faculty model.
  opening_requirements:
  - Name IIT-JEE Test Prep Institute and its core operating model.
  - Confirm the core performance challenge or strategic mandate.
  - Confirm primary metric (Operating profit margin) and time horizon (twelve months).
  - Ask clarifying questions before structuring the issue tree.
objective_function:
  primary_metric: Operating profit margin
  decision_question: Why did test prep institute profits drop despite record student enrollment, and how should faculty compensation
    be restructured?
  time_horizon: twelve months
  expected_candidate_output:
  - Root cause diagnosis supported by unit economics and data.
  - Prioritized 3-pillar actionable recommendation.
  - Key operational and commercial risks with mitigations.
  - 100-day execution milestones.
  design_principle: Reward first-principles problem structuring and hypothesis testing over memorized framework dumping.
case_essence:
  core_mechanism: Star faculty poaching war leading to escalating fixed retention bonuses and profit-share guarantees (up
    to 60% of batch revenue) coupled with high student churn when poached faculty defect to competing online platforms.
  what_the_case_wanted_to_test: Talent asset-heavy economics, key-man revenue concentration, and teacher-student brand attribution.
  pivotal_insight: Enrollment is strong but student retention and pricing power are tied to individual star faculty who demanded
    65% compensation increases under threat of defection to venture-backed edtechs.
  common_traps:
  - Blaming digital classroom infrastructure or software capex.
  - Proposing across-the-board student tuition hikes in a hyper-competitive coaching hub.
  - Assuming physical real estate center leases explain the margin collapse.
  takeaway_lesson: In human-capital education businesses, relying on celebrity individual talent creates unsustainable margin
    capture by workers unless the curriculum and brand institutionalize teaching IP.
  suggested_readings:
  - knowledge_base/industries/08_saas_and_b2b_tech.md
  - knowledge_base/case_types/profitability.md
  - knowledge_base/methodology/03_hypothesis_driven_drilling.md
