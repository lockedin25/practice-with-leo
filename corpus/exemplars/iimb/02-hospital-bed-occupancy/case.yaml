candidate_opening:
  context: Your client is a 450-bed multispecialty tertiary hospital in Bengaluru. Overall bed occupancy is low (64%), yet
    elective surgeries are routinely cancelled due to ICU bed shortages.
  objective: Diagnose the operational bottleneck in surgical and ICU patient flow and recommend a capacity optimization plan.
  opening_requirements:
  - Name Hospital Surgical Throughput and its core operating model.
  - Confirm the core performance challenge or strategic mandate.
  - Confirm primary metric (Surgical Theatre Utilization (%) and ICU Length of Stay (days)) and time horizon (six months).
  - Ask clarifying questions before structuring the issue tree.
objective_function:
  primary_metric: Surgical Theatre Utilization (%) and ICU Length of Stay (days)
  decision_question: Why are elective surgeries delayed despite low overall hospital bed occupancy?
  time_horizon: six months
  expected_candidate_output:
  - Root cause diagnosis supported by unit economics and data.
  - Prioritized 3-pillar actionable recommendation.
  - Key operational and commercial risks with mitigations.
  - 100-day execution milestones.
  design_principle: Reward first-principles problem structuring and hypothesis testing over memorized framework dumping.
case_essence:
  core_mechanism: ICU bed blockage caused by step-down ward discharge delays (averaging 14 hours post-physician discharge
    order) and non-standardized post-operative recovery protocols, which backed up into operating theatre cancellations.
  what_the_case_wanted_to_test: Hospital patient flow dynamics, critical care capacity bottlenecks, discharge coordination
    lag, and schedule smoothing across surgical specialties.
  pivotal_insight: General ward beds are 36% empty, but post-op cardiac/orthopedic patients cannot leave the 40-bed ICU because
    step-down wards take 14 hours to process billing, pharmacy clearance, and bed turnover.
  common_traps:
  - Assuming surgeon availability or operating room count is the constraint.
  - Recommending building an expensive 50-bed ICU expansion without auditing discharge cycle time.
  - Blaming emergency trauma patient spikes for scheduled surgery cancellations.
  takeaway_lesson: In complex healthcare systems, flow blockage in downstream recovery units (ICU/step-down) starves upstream
    revenue-generating assets (Operating Theatres), regardless of total hospital bed capacity.
  suggested_readings:
  - knowledge_base/industries/03_pharma_and_healthcare.md
  - knowledge_base/case_types/unconventional_and_abstract.md
  - knowledge_base/methodology/02_issue_tree_structuring.md
