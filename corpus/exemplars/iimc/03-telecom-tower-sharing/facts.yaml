schema_version: reservoir-facts-v1
facts:
- id: tower.scale
  domain: company
  release_level: broad_context
  content: Client operates 120,000 macro-towers across all 22 Indian telecom circles.
- id: tenancy.drop
  domain: financials
  release_level: sharp_question
  content: Average tenancy fell from 2.2x to 1.6x as merged telcos surrendered 70,000 redundant co-located tenancies.
- id: energy.leakage
  domain: operations
  release_level: hypothesis_backed
  content: "Client provides power/fuel at fixed rates but diesel generator costs rose, turning energy operations into a \u20B9\
    220 Cr annual loss."
  dependencies:
  - tenancy.drop
- id: small_cell.demand
  domain: market
  release_level: hypothesis_backed
  content: 5G rollout requires 400,000 street-level small cells (utility poles, bus shelters, billboards) connected by fiber.
  dependencies:
  - energy.leakage
- id: diagnosis.hidden
  domain: diagnosis
  release_level: interviewer_only
  provenance: source_derived
  content: "Tenancy fell from 2.2x to 1.6x due to telco consolidation, while fixed diesel energy contracts lost \u20B9220\
    \ Cr; towerco must pivot to Energy-as-a-Service (solar/battery) and monetize 5G small-cell street furniture."
- id: recommendation.green_energy
  domain: recommendation
  release_level: synthesis_support
  content: Convert 45,000 diesel tower sites into solar-plus-lithium battery hubs and shift to an Energy-as-a-Service model
    with fixed uptime SLAs.
- id: recommendation.small_cells
  domain: recommendation
  release_level: synthesis_support
  content: Deploy 60,000 5G smart-city small-cells on municipal street poles and traffic lights.
- id: recommendation.fiber_sharing
  domain: recommendation
  release_level: synthesis_support
  content: Monetize fiber-to-the-tower (FTTT) sharing across multiple telecom and broadband operators.
