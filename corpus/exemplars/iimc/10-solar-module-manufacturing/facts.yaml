- id: market.demand
  domain: market
  release_level: broad_context
  content: India requires 30 GW of solar modules annually to meet its 500 GW 2030 renewable target.
- id: policy.protection
  domain: regulation
  release_level: sharp_question
  content: Government enforces 40% Basic Customs Duty on imported modules and mandates Approved List of Models and Manufacturers
    (ALMM) for all grid projects.
- id: tech.comparison
  domain: operations
  release_level: hypothesis_backed
  content: P-type PERC (21.5% efficiency) is obsolete; N-type TOPCon (24.5% efficiency) costs $0.015/Wp more to build but
    yields 8% higher energy output, commanding a 12% price premium.
