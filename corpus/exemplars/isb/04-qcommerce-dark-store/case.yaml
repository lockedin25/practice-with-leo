candidate_opening:
  context: Your client operates 300 quick-commerce dark stores across 5 Indian metros. Dark store EBITDA is negative (-8%)
    due to high picker-packer labor overhead and rider idle waiting time.
  objective: Optimize dark store layout, batch-picking algorithms, and rider dispatch to achieve dark store EBITDA breakeven.
  opening_requirements:
  - Name Quick-Commerce Dark Store Density and its core operating model.
  - Confirm the core performance challenge or strategic mandate.
  - Confirm primary metric (Dark Store EBITDA Margin (%) and Orders Picked Per Man-Hour) and time horizon (six months).
  - Ask clarifying questions before structuring the issue tree.
objective_function:
  primary_metric: Dark Store EBITDA Margin (%) and Orders Picked Per Man-Hour
  decision_question: How should dark store operations and order batching be re-engineered to achieve store-level profitability?
  time_horizon: six months
  expected_candidate_output:
  - Root cause diagnosis supported by unit economics and data.
  - Prioritized 3-pillar actionable recommendation.
  - Key operational and commercial risks with mitigations.
  - 100-day execution milestones.
  design_principle: Reward first-principles problem structuring and hypothesis testing over memorized framework dumping.
case_essence:
  core_mechanism: Pick-path congestion and un-batched order picking. Pickers walk 140 meters per single order across poorly
    mapped aisles, while delivery riders wait 6.5 minutes outside for packing completion, destroying labor productivity.
  what_the_case_wanted_to_test: Warehouse layout optimization, pick-path routing algorithms, wave vs batch picking, and dispatch
    synchronization.
  pivotal_insight: Re-organizing dark stores with top-100 high-velocity SKUs near the packing station and implementing multi-order
    batch picking cuts picker walking distance by 65% and doubles picks per hour.
  common_traps:
  - Assuming store rent in city centers is the sole cause of store losses.
  - Cutting dark store staff, which causes order fulfillment times to miss the 10-minute SLA.
  - Expanding store square footage.
  takeaway_lesson: In micro-fulfillment, picker walking distance is the primary labor bottleneck; high-density golden-zone
    slotting and multi-order batching double labor productivity.
  suggested_readings:
  - knowledge_base/industries/02_ecommerce_and_marketplaces.md
  - knowledge_base/case_types/profitability.md
  - knowledge_base/methodology/02_issue_tree_structuring.md
